[pytest]
# Coverage runs by default so `pytest` locally and in CI report the same thing,
# and so a drop in coverage fails the build rather than going unnoticed.
#
# The floor is deliberately just under the current total (~87%) rather than at a
# round 90: it exists to stop regressions, not to block work. Raise it as the
# number climbs; lowering it needs a reason in the PR.
addopts = --cov=app --cov-report=term-missing --cov-fail-under=85
testpaths = tests
