# ClassTrack: Postgres + FastAPI + React (nginx).
#   cp .env.example .env    # set JWT_SECRET at least
#   docker compose up --build
#   open http://localhost:8080
name: classtrack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: classtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classtrack}
      POSTGRES_DB: classtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classtrack -d classtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://classtrack:${POSTGRES_PASSWORD:-classtrack}@db:5432/classtrack
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_CAN_VIEW_JOB_APPLICATIONS: ${ADMIN_CAN_VIEW_JOB_APPLICATIONS:-false}
      TIMEZONE: ${TIMEZONE:-UTC}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GRADING_MODEL: ${GRADING_MODEL:-claude-opus-5}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_LAG_TEMPLATE: ${WHATSAPP_LAG_TEMPLATE:-}
      # One backend replica runs the nightly lag check / weekly digest.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      LAG_CHECK_HOUR: ${LAG_CHECK_HOUR:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${API_PORT:-8000}:8000" # optional: direct API access + Swagger at /docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
