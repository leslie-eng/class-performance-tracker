# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard > New > Blueprint > pick this repo. Keys marked `sync: false` are
# prompted for on first creation and never stored in git.
services:
  # FastAPI backend (Docker). Migrations run on every start (backend/docker-entrypoint.sh).
  - type: web
    name: classtrack-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL # Neon / Supabase / Render Postgres connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS # comma separated; these users become admins on register
        sync: false
      - key: CORS_ORIGINS # the frontend URL, e.g. https://classtrack-web.onrender.com
        sync: false
      - key: ANTHROPIC_API_KEY # optional; AI grading is off without it
        sync: false
      - key: GRADING_MODEL
        value: claude-opus-5
      - key: TIMEZONE
        value: UTC
      - key: ADMIN_CAN_VIEW_JOB_APPLICATIONS
        value: "false"
      - key: WHATSAPP_PROVIDER # console | meta
        value: console
      - key: WHATSAPP_TOKEN # only for WHATSAPP_PROVIDER=meta
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_LAG_TEMPLATE
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: LAG_CHECK_HOUR
        value: "20"
      - key: WEEKLY_DIGEST_DAY
        value: sun

  # React frontend (static site). It calls the API directly at VITE_API_URL.
  - type: web
    name: classtrack-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite # client-side routes (/leaderboard, /grading/12, ...)
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # the API URL, e.g. https://classtrack-api.onrender.com (no trailing slash)
        sync: false
      - key: NODE_VERSION
        value: "22"

# To use Render Postgres instead of an external database, uncomment this and replace
# the DATABASE_URL entry above with:
#      - key: DATABASE_URL
#        fromDatabase:
#          name: classtrack-db
#          property: connectionString
