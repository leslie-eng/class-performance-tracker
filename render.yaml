# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard > New > Blueprint > pick this repo. Keys marked `sync: false` are
# prompted for on first creation and never stored in git.
services:
  # FastAPI backend (native Python). Migrations run before every start.
  - type: web
    name: classtrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: FORWARDED_ALLOW_IPS # trust Render's proxy headers (client IP, https scheme)
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: classtrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS # comma separated; these users become admins on register
        sync: false
      - key: CORS_ORIGINS # the frontend URL, e.g. https://classtrack-web.onrender.com
        sync: false
      - key: ANTHROPIC_API_KEY # optional; AI grading is off without it
        sync: false
      - key: GRADING_MODEL
        value: claude-opus-5
      - key: TIMEZONE # also moves "today" for streaks and the 8pm lag check
        value: Africa/Nairobi
      - key: ADMIN_CAN_VIEW_JOB_APPLICATIONS
        value: "false"
      - key: WHATSAPP_PROVIDER # console | meta
        value: console
      - key: WHATSAPP_TOKEN # only for WHATSAPP_PROVIDER=meta
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_LAG_TEMPLATE
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: LAG_CHECK_HOUR
        value: "20"
      - key: WEEKLY_DIGEST_DAY
        value: sun
      # Friday Drop (weekly summary, project picks, quizzes)
      - key: WEEKLY_DROP_DAY
        value: fri
      - key: WEEKLY_DROP_HOUR
        value: "8"
      - key: MONTHLY_QUIZ_WEEK # first | last Friday of the month
        value: first
      - key: SPECIALIZATIONS
        value: data_engineering,data_science,software_engineering,ai_engineering,embedded_iot,general
      - key: QUIZ_MODEL # blank = GRADING_MODEL; a cheaper model works well for generation
        sync: false
      - key: REQUIRE_QUIZ_REVIEW # true = generated quizzes wait for an admin to publish them
        value: "false"
      - key: FRONTEND_URL # links in WhatsApp messages, e.g. https://classtrack-web.onrender.com
        sync: false
      - key: WHATSAPP_WEEKLY_TEMPLATE # approved Meta template (one body parameter) for drops and admin alerts
        sync: false
      - key: JOB_TOKEN # shared secret for the external cron that wakes the API on Fridays
        generateValue: true
      # Coding exercises: none = browser runs only; remote = external Judge0-compatible sandbox
      - key: CODE_RUNNER
        value: none
      - key: CODE_RUNNER_URL
        sync: false
      - key: CODE_RUNNER_KEY
        sync: false

  # React frontend (static site). It calls the API directly at VITE_API_URL.
  - type: web
    name: classtrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite # client-side routes (/leaderboard, /grading/12, ...)
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # the API's public URL, e.g. https://classtrack-api.onrender.com (no trailing slash)
        sync: false
      - key: NODE_VERSION
        value: "22"

# Render Postgres. Free databases expire after 30 days. To use Neon/Supabase instead,
# delete this block and change DATABASE_URL above to `sync: false`.
databases:
  - name: classtrack-db
    plan: free
    databaseName: classtrack
    user: classtrack
